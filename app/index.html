<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mecânica Pro · Sistema para oficinas</title>
  <meta name="description" content="Sistema de gestão para oficinas mecânicas: ordens de serviço, orçamentos, clientes, veículos, estoque, agenda, financeiro e WhatsApp.">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mecânica Pro">
  <script>
    // Aplica o tema antes de desenhar a página (evita "piscar" branco no tema escuro).
    (function () {
      var p = 'auto';
      try { p = localStorage.getItem('mp:tema') || 'auto'; } catch (e) {}
      var escuro = p === 'escuro' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/impressao.css">
</head>
<body>
  <div id="app">
    <div class="tela-cheia">
      <div class="carregando-marca">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></svg>
      </div>
      <p>Carregando…</p>
      <div class="barra-indeterminada"></div>
    </div>
  </div>
  <div id="area-impressao" aria-hidden="true"></div>
  <noscript>
    <p style="padding:24px;font-family:sans-serif">O Mecânica Pro precisa do JavaScript ativado no navegador.</p>
  </noscript>
  <script type="module">
    import { iniciar } from './js/app.js';
    iniciar();
  </script>
</body>
</html>
